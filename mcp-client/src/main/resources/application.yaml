logging:
  level:
    org.springframework.ai.mcp: DEBUG
    io.modelcontextprotocol: DEBUG
    org.springframework.web.client: DEBUG

spring:
  application:
    name: mcp-client
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        options:
          model: gpt-5.4
    mcp:
      client:
        enabled: true
        name: comment-mcp-client
        version: 1.0.0
        type: SYNC
        initialized: false
        request-timeout: 30s
        sse:
          connections:
            comment-server:
              url: http://localhost:8081/sse
              sse-endpoint: /sse

server:
  port: 8082
