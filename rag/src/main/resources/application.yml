server:
  port: 8080

spring:
  application:
    name: rag-project

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:gemma4:latest}
          temperature: 0.7
      embedding:
        options:
          model: qwen3-embedding

    vectorstore:
      type: milvus
      milvus:
        uri: http://localhost:19530
        collection-name: rag_documents
        index-type: IVF_FLAT
        metric-type: COSINE
        embedding-dimension: 4096
        initialize-schema: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

rag:
  document:
    chunk-size: 2000
